name: ATS company harvest

# Weekly discovery and validation of ATS company boards, published to the
# `ats-harvest` orphan branch that sync_ats_companies.py pulls.
#
# Two halves, and both are necessary:
#
#   1. Collect. Sweeps the Common Crawl and Wayback URL indexes for company
#      slugs. The lists we ship come from Feashliaa/job-board-aggregator, which
#      builds them with a harvester it does not publish, so without this our
#      lists only grow when that maintainer regenerates theirs.
#
# Validation deliberately does NOT run here, and that is a standing decision
# rather than an oversight. Runner IPs are Azure datacenter ranges that Workday
# and iCIMS rate-limit or block outright. Validation writes its misses to
# dead_slugs, so a blocked run marks thousands of live boards dead, and that
# corruption then follows into the bot that reads those files. Evaluated and
# rejected 2026-08-24; scripts/validate_ats_slugs.py runs on the bot's own host
# instead, from an address the platforms actually answer.
#
# The split is not arbitrary. Collection reads static index files from
# data.commoncrawl.org and never contacts an ATS at all, so it cannot produce a
# dead mark no matter how a runner is treated. Validation is the entire
# poisoning path, and it is the half that stays local.
#
# Collection alone is not enough overall -- measured live rates for newly
# harvested slugs run from 87% (BambooHR) down to 11% (iCIMS), so an
# append-only list fills with companies that never answer, and each one costs
# the bot a request every scrape cycle, forever. That is what the local
# validation pass is for; it publishes nothing here.
#
# Why an orphan branch rather than commits to main: same reasoning as
# geonames-sync.yml. Both halves rewrite whole files on a schedule, and
# committing them weekly would put a large diff in main's history every run for
# data that is entirely regenerable. The branch is force-pushed to one commit.
#
# Collection is additive by construction -- the harvester unions onto whatever
# the branch already holds and never deletes. That matters because archive
# coverage genuinely fluctuates: Lever blocks CCBot in robots.txt and left
# Common Crawl after CC-MAIN-2025-38, so a run that overwrote rather than merged
# would erase thousands of Lever companies the first time it ran.

on:
  schedule:
    # Weekly, Tuesdays 03:41 UTC. Common Crawl publishes roughly monthly, so
    # this is already more often than the source data changes; the point is to
    # pick up a new crawl within days of release. The odd minute avoids the
    # top-of-hour spike when GitHub delays scheduled jobs.
    - cron: "41 3 * * 2"
  # Temporary, for first-run validation. workflow_dispatch only works for
  # workflows present on the default branch, and this one lives on a feature
  # branch, so a push trigger scoped to that branch is what lets it run at all
  # before merge. Remove once this is on main.
  push:
    branches: [ats-commoncrawl-harvest]
    paths:
      - .github/workflows/ats-harvest.yml
      - scripts/harvest_ats.py
      - scripts/validate_ats_slugs.py
  workflow_dispatch:
    inputs:
      crawls:
        description: "How many recent Common Crawl snapshots to sweep"
        required: false
        default: "6"
      extra_crawls:
        description: >-
          Space-separated crawl ids to also sweep, e.g.
          "CC-MAIN-2025-38 CC-MAIN-2024-38". Use to backfill platforms that have
          dropped out of recent crawls.
        required: false
        default: ""
      indexes:
        description: "Which archives to sweep"
        required: false
        default: "both"
        type: choice
        options: ["both", "ccbulk", "commoncrawl", "wayback"]
      validate_limit:
        description: "Max slugs to probe per platform (0 disables validation)"
        required: false
        default: "12000"

permissions:
  contents: write

concurrency:
  # Never two runs at once: both would force-push the branch and the loser's
  # discoveries and dead marks would be dropped rather than merged.
  group: ats-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify harvester and validator before running them
        # Both parse someone else's URL conventions and status-code semantics.
        # When those change, these tests are what notice. Running a broken
        # harvester publishes garbage slugs that every bot then probes for 90
        # days; running a broken validator marks live companies dead, which is
        # worse, because it removes boards that work.
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --upgrade pip
          # The scripts themselves are stdlib-only on purpose, but tests/conftest.py
          # has autouse fixtures that import the bot to keep tests off real state,
          # and those need the bot's own dependencies. Installing them is the
          # honest fix: loosening the fixtures would trade a red CI for silent
          # pollution of the real caches, which is what they exist to prevent.
          pip install pytest requests pyyaml beautifulsoup4
          pytest tests/test_harvest_ats.py tests/test_validate_ats_slugs.py                  tests/test_workflow_wiring.py -q

      - name: Fetch the previously published state
        # The harvester merges into whatever is already in --out, and the
        # validator merges into existing dead marks. Seeding both from the
        # branch is what makes runs cumulative rather than each replacing the
        # last.
        run: |
          set -euo pipefail
          mkdir -p data/ats_harvest
          if git fetch --depth=1 origin ats-harvest 2>/dev/null; then
            for p in greenhouse lever ashby workday icims bamboohr paylocity workable breezy smartrecruiters rippling teamtailor jazzhr recruitee jobvite applicantpro oracle personio; do
              git show "FETCH_HEAD:$p.json" > "data/ats_harvest/$p.json" 2>/dev/null \
                && echo "seeded harvest $p" || echo "no published $p.json yet"
            done
            # The crawl-listing cache has to come back too. CI checks out fresh
            # every run, so a cache that is published but never restored is
            # never actually read -- which is precisely the run where
            # collinfo.json is down and it was meant to help.
            git show "FETCH_HEAD:_crawls.json" > "data/ats_harvest/_crawls.json" 2>/dev/null \
              && echo "seeded crawl cache" || echo "no published _crawls.json yet"
          else
            echo "no ats-harvest branch yet - first run"
          fi

      - name: Re-apply current rules to the seeded harvest
        # Harvest output is cumulative and published, so a slug written by an
        # older revision of the extraction rules survives forever unless
        # something replays them. Every tightening so far -- Workday asset
        # paths, root.<uuid> debris, version strings, numbered infrastructure
        # hosts, trailing punctuation -- had to be applied to the existing
        # files by hand. This makes those fixes retroactive automatically.
        #
        # Offline and idempotent: it replays the same extractor used to
        # harvest, so it cannot remove anything a fresh sweep would keep.
        run: |
          set -euo pipefail
          python scripts/harvest_ats.py --prune --out data/ats_harvest

      - name: Collect
        # Six crawls rather than one. That default dates from when every crawl
        # meant paging the rate-limited query service; reading the published
        # index files made a multi-crawl sweep cheap.
        #
        # Six rather than thirty, though, and that bound is deliberate. Two
        # matched sweeps differing only in the age of the crawls:
        #
        #   12 recent   (CC-MAIN-2025-38 .. 2026-34)  +5,378 at 90.7% live
        #   18 archival (CC-MAIN-2024-10 .. 2025-33)  +2,475 at 32.2% live
        #    8 older    (CC-MAIN-2022-33 .. 2023-50)  +1,259 at 11.7% live
        #
        # Reaching further back keeps finding companies and they keep getting
        # deader, and past a point the trade goes negative. The 2022-2023 sweep
        # bought about 145 live boards and 1,114 dead ones; ats_service
        # re-probes a dead slug every DEAD_SLUG_RECHECK_DAYS, so those cost on
        # the order of 8,000 requests a year, permanently, for 145 companies.
        #
        # Raising this number looks like more coverage and is mostly more work
        # for the bot. The age of the evidence, not the archive it came from,
        # is what predicts a live board.
        #
        # Lever is the one reason to sweep archival crawls at all: it blocks
        # CCBot, so it left Common Crawl after CC-MAIN-2025-38 and older crawls
        # are its only CC source. Use the extra_crawls input for that rather
        # than raising this.
        #
        # Inputs reach the shell as environment variables rather than being
        # interpolated into the script text: a ${{ }} expansion is pasted in
        # verbatim before bash parses the line, so a crafted value would run as
        # part of the command.
        env:
          CRAWLS: ${{ github.event.inputs.crawls || '6' }}
          EXTRA_CRAWLS: ${{ github.event.inputs.extra_crawls || '' }}
          INDEXES: ${{ github.event.inputs.indexes || 'both' }}
        run: |
          set -euo pipefail
          args=(--crawls "$CRAWLS" --out data/ats_harvest --json)
          # Let the harvester discover crawls from the bulk host when the
          # listing and its cache are both unavailable. CI checks out fresh, so
          # on a first run -- or any run after the cache failed to publish --
          # there is nothing to fall back on, and collinfo.json going down
          # would otherwise cost the whole Common Crawl half. Years are
          # computed rather than pinned so this does not quietly stop covering
          # the current year.
          this_year=$(date -u +%Y)
          args+=(--discover-years "$this_year" "$((this_year - 1))")
          if [ "$INDEXES" != "both" ]; then
            args+=(--index "$INDEXES")
          fi
          # Word-split deliberately, and only when non-empty: `for c in ; do` is
          # a bash syntax error, which would break every scheduled run (they
          # never set this input).
          if [ -n "$EXTRA_CRAWLS" ]; then
            for c in $EXTRA_CRAWLS; do
              args+=(--crawl "$c")
            done
          fi
          echo "running: harvest_ats.py ${args[*]}"
          python scripts/harvest_ats.py "${args[@]}" > harvest.json
          cat harvest.json

      - name: Re-apply current rules to what was just collected
        # Prune runs twice on purpose. The pass before Collect exists because
        # pruning is a read-modify-write over the files a collection then
        # writes, so it cannot run concurrently with one. But that pass can
        # only clean what was already published -- anything the collection
        # itself introduces is published uncleaned and waits a whole week for
        # the next run's first pass.
        #
        # Measured on the first published harvest: 56 bamboohr slugs carrying
        # undecoded %2f residue ("2faaei" for "aaei") reached the branch and
        # the bot synced every one. Each is a duplicate of a company already
        # held under its right name, and every probe of one is a request that
        # cannot succeed. Running the same prune after Collect drops all 56
        # before publication instead of after.
        #
        # Safe here in a way it is not elsewhere: Collect has finished writing,
        # and the prune is offline and idempotent -- it replays the extractor
        # used to harvest, so it cannot remove anything a fresh sweep keeps.
        run: |
          set -euo pipefail
          python scripts/harvest_ats.py --prune --out data/ats_harvest

      - name: Verify the collection before publishing it
        # A collapsed harvest is the failure mode that rots unnoticed: an index
        # returning empty pages, or a URL convention changing under the
        # extractors, both produce a valid file with almost nothing in it. That
        # would not break the bot -- the merge is a union -- it would just
        # silently harvest nothing while reporting success every week.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys, pathlib

          # Deliberately calibrated against a SINGLE crawl, not the six this
          # sweeps by default, so lowering --crawls never fails the build. Each
          # is roughly 40% of what one crawl really yields:
          #
          #   greenhouse 3,015   ashby 1,857   icims 2,005
          #   bamboohr   3,340   workday 2,372  paylocity 789
          #
          # The previous floors were set when a run swept one crawl through the
          # query service and were never revisited. Against a 12-crawl bulk
          # sweep they sat 13-33x below actual yield -- BambooHR harvested 9,741
          # against a floor of 300 -- so the gate could not have caught a
          # collapse, which is the only thing it exists for.
          #   workable   3,158   breezy  2,063   (measured on CC-MAIN-2026-34)
          FLOORS = {"greenhouse": 1200, "ashby": 700, "workday": 500,
                    "icims": 700, "bamboohr": 1200, "paylocity": 300,
                    "workable": 1200, "breezy": 800,
                    "smartrecruiters": 200, "rippling": 350,
                    "teamtailor": 350, "jazzhr": 200, "recruitee": 200,
                    "jobvite": 240, "applicantpro": 160,
                    # Placeholders, and labelled as such. Every other number
                    # here is a measured baseline; these two have never been
                    # harvested, so there is nothing to measure yet. A floor of
                    # 1 still guards the collapse that actually happens -- an
                    # extractor or query that breaks and yields nothing at all
                    # -- without inventing a baseline. Raise them from the
                    # first real run's counts.
                    "oracle": 1, "personio": 1}

          platforms = json.load(open("harvest.json"))["platforms"]
          failed = []
          for name, floor in FLOORS.items():
              got = platforms.get(name, {}).get("harvested", 0)
              print(f"{name:11} harvested={got:6} floor={floor:5} "
                    f"{'ok' if got >= floor else 'LOW'}")
              if got < floor:
                  failed.append(f"{name}: {got} < {floor}")

          # Lever has no floor on purpose. It blocks CCBot, so Common Crawl
          # carries only its robots.txt and a commoncrawl-only run legitimately
          # finds zero. Its companies come from Wayback.
          lev = platforms.get("lever", {}).get("harvested", 0)
          print(f"{'lever':11} harvested={lev:6} (no floor - blocks CCBot)")


          for name, data in platforms.items():
              for err in data.get("errors", []):
                  print(f"::warning::{name}: {err}")

          if failed:
              print("::error::harvest below floor: " + "; ".join(failed))
              sys.exit(1)

          for path in sorted(pathlib.Path("data/ats_harvest").glob("*.json")):
              # _crawls.json caches the Common Crawl listing so a flaky
              # collinfo.json cannot silently drop the whole CC half of a run.
              # It rides along in the published branch but is not a slug list.
              if path.name.startswith("_"):
                  continue
              payload = json.loads(path.read_text())
              assert isinstance(payload, list), f"{path} is not a list"
              assert payload == sorted(payload), f"{path} is not sorted"
          print("collection output parses, is a list, and is sorted")
          PY

      - name: Build the manifest
        # Consumers fetch this first: a few hundred bytes says whether anything
        # changed before they pull the lists.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, pathlib, datetime

          out = pathlib.Path("publish")
          (out / "dead").mkdir(parents=True, exist_ok=True)
          # The harvest and the crawl cache, and nothing else. dead_slugs and
          # ats_checked are produced by the local validation pass and stay on
          # the host that produced them: publishing a runner's view of which
          # boards are dead is the poisoning path this workflow exists to avoid.
          files = {}
          for src, prefix in ((pathlib.Path("data/ats_harvest"), ""),):
              for path in sorted(src.glob("*.json")):
                  raw = path.read_bytes()
                  if path.name.startswith("_") and prefix == "":
                      # Cache file: publish it so the next run can fall back on
                      # it, but keep it out of the per-platform counts.
                      (out / path.name).write_bytes(raw)
                      continue
                  (out / f"{prefix}{path.name}").write_bytes(raw)
                  files[f"{prefix}{path.name}"] = {
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "count": len(json.loads(raw)),
                  }
          manifest = {
              "updated": datetime.datetime.now(datetime.timezone.utc)
                          .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "sources": ["https://index.commoncrawl.org",
                          "http://web.archive.org/cdx"],
              "generator": "scripts/harvest_ats.py",
              "files": files,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Skip when nothing changed
        id: changed
        # Force-pushing identical bytes still moves the branch and makes every
        # bot re-fetch.
        run: |
          set -euo pipefail
          changed=false
          for p in greenhouse lever ashby workday icims bamboohr paylocity workable breezy smartrecruiters rippling teamtailor jazzhr recruitee jobvite applicantpro oracle personio; do
            for rel in "$p.json"; do
              [ -f "publish/$rel" ] || continue
              new=$(sha256sum "publish/$rel" | cut -d' ' -f1)
              old=$(git show "FETCH_HEAD:$rel" 2>/dev/null | sha256sum | cut -d' ' -f1 || echo none)
              if [ "$new" != "$old" ]; then
                echo "$rel changed"
                changed=true
              fi
            done
          done
          echo "publish=$changed" >> "$GITHUB_OUTPUT"
          [ "$changed" = true ] || echo "nothing to publish"

      - name: Publish to the ats-harvest branch
        if: steps.changed.outputs.publish == 'true'
        # The token goes through the environment, not the command line: a secret
        # interpolated into `run:` lands in the process arguments, where a shell
        # trace or a crash dump would carry it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd publish
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan ats-harvest
          # ./*.json already covers _crawls.json -- a bash glob matches a
          # leading underscore, unlike a leading dot.
          git add ./*.json
          git commit -q -m "ATS harvest + validation $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            ats-harvest
          echo "published to ats-harvest"

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## ATS harvest"
            echo
            echo "| platform | harvested | new | total |"
            echo "|---|---:|---:|---:|"
            python - <<'PY'
          import json, pathlib
          def load(name, key):
              p = pathlib.Path(name)
              if not p.exists():
                  return {}
              try:
                  return json.load(open(name)).get(key, {})
              except Exception:
                  return {}
          h = load("harvest.json", "platforms")
          # Collection only. There are no probe, live or dead columns because
          # this job never asks an ATS anything -- validation runs on the bot's
          # own host, where the platforms answer, and its numbers are reported
          # there. A live rate printed here would be a runner's opinion of which
          # companies exist, which is exactly what must not be trusted.
          for name in ["greenhouse", "lever", "ashby", "workday", "icims",
                       "bamboohr", "paylocity", "workable", "breezy",
                       "smartrecruiters", "rippling", "teamtailor", "jazzhr",
                       "recruitee", "jobvite", "applicantpro",
                       "oracle", "personio"]:
              a = h.get(name, {})
              print(f"| {name} | {a.get('harvested', 0)} | {a.get('new', 0)} | "
                    f"{a.get('total', 0)} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
