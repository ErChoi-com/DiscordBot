; Type-checking ratchet.
;
; mypy runs over all of src/ by default, so any NEW module is checked from the
; moment it is added. The modules listed at the bottom carry pre-existing
; errors and are exempted individually - that list is debt, and it should only
; ever shrink. Delete an entry once its module is clean.
;
;   python -m mypy src                    # what CI runs
;   python -m mypy --ignore-missing-imports src/services/job_service.py
;                                         # check one exempted module's debt
;
; Error counts at the time this was introduced (213 total) are noted per module
; so progress is visible without re-running the whole suite.

[mypy]
python_version = 3.14
files = src
ignore_missing_imports = True
warn_unused_configs = True

; Kept off for now: turning these on adds several hundred errors across modules
; that are otherwise clean. Enable once the exemption list below is empty.
disallow_untyped_defs = False
disallow_incomplete_defs = False

; discord.py ships partial stubs; its dynamic attributes produce noise that is
; not actionable in our code.
[mypy-discord.*]
ignore_missing_imports = True
follow_imports = skip

; ── Exemption list (debt) ────────────────────────────────────────────────────
; Discord-facing layers. Most errors here are `union-attr` on optional
; interaction/channel attributes - i.e. real None-safety gaps worth fixing, not
; just annotation noise. Highest-value cleanup target despite being the largest.

[mypy-src.commands.handlers]
; 60 error(s)
ignore_errors = True

