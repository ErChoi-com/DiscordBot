[pytest]
# The unit/integration suite lives entirely in tests/. It is hermetic: no
# network, no browser, no live Discord.
#
# autofill_extension/tests/ is a separate Playwright suite that loads the
# unpacked Chrome extension and (in test_real_websites.py) hits live ATS
# sites, so it is deliberately outside testpaths. Run it explicitly:
#     pytest autofill_extension/tests
testpaths = tests
norecursedirs = chrome_profile dedup_listings .venv .resume_cache autofill_extension
